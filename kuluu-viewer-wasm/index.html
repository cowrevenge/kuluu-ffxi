<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>Kuluu Viewer</title>
    <meta name="description" content="Kuluu: an open-source FINAL FANTASY XI client. Browser scene viewer." />
    <meta name="theme-color" content="#252a1b" />
    <link data-trunk rel="copy-dir" href="branding" />
    <link rel="icon" type="image/png" sizes="32x32" href="branding/kuluu-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="branding/kuluu-180.png" />
    <link rel="manifest" href="branding/site.webmanifest" />
    <link data-trunk rel="rust" data-type="main" />
    <style>
        :root {
            --chrome-bg: #0b0b10;
            --chrome-fg: #00d8d8;
            --chrome-border: #666;
        }
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            background: var(--chrome-bg);
            color: var(--chrome-fg);
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            overflow: hidden;
        }
        #titlebar {
            position: fixed;
            top: 0; left: 0; right: 0;
            padding: 4px 12px;
            color: var(--chrome-fg);
            border-bottom: 1px solid var(--chrome-border);
            font-size: 13px;
            letter-spacing: 0.5px;
            z-index: 10;
            pointer-events: none;
        }
        canvas#bevy {
            display: block;
            width: 100vw;
            height: 100vh;
            outline: none;
        }
    </style>
</head>
<body>
    <div id="titlebar">▌ kuluu-viewer ●</div>
    <canvas id="bevy"></canvas>
</body>
</html>
